name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the built asset to'
        required: true

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      # Build
      - name: Build the file
        run: |
          cd /home/runner/work/flipdown-timer-card/flipdown-timer-card
          npm install
          npm run build

      # Upload build file to the releas as an asset.
      - name: Upload zip to release
        uses: svenstaro/upload-release-action@v1-release

        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: /home/runner/work/flipdown-timer-card/flipdown-timer-card/dist/flipdown-timer-card.js
          asset_name: flipdown-timer-card.js
          tag: ${{ github.event.inputs.tag || github.ref }}
          overwrite: true